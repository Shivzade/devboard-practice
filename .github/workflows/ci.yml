# Goal - I have to lint, Build and test the code for frontend and backend
# and push images into the docker

name: CI

on:
    push:
        branches: [advanced]

jobs:
    frontend:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout the code
              uses: actions/checkout@v4

            - name: Setup Node Js
              uses: actions/setup-node@v6
              with:
                node-version: "24"
                cache: npm
                dependency-path: frontend\package-lock.json

            - name: Install NPM Packages
              run: npm ci --legacy-peer-deps
              #working-directory: frontend

            - name: RUN Linter
              run: npm run lint
              working-directory: frontend

            - name: Run Tests
              run: npm run test

            - name: Docker Login
              uses: docker/login-action@v4
              with:
                username: ${{ vars.DOCKERHUB_USERNAME }}
                password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Build and Push
              uses: docker/build-push-action@v7
              with: 
                context: ./frontend\Dockerfile.multistage
                push: true
                tags: ${{ vars.DOCKERHUB_USERNAME }}/devboard-frontend:latest
                
              

            