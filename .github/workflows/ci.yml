# Goal - I have to lint, Build and test the code for frontend and backend
# and push images into the docker

name: CI

on:
    push:
        branches: [advanced]

jobs:
    frontend:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout the code
              uses: actions/checkout@v4

            - name: Setup Node Js
              uses: actions/setup-node@v6
              with:
                node-version: "24"
                cache: npm
                dependency-path: frontend\package-lock.json

            - name: Install NPM Packages
              run: npm ci --legacy-peer-deps
              #working-directory: frontend

            - name: RUN Linter
              run: npm run lint
              working-directory: frontend

            - name: Run Tests
              run: npm run test

            - name: Docker Login
              uses: docker/login-action@v4
              with:
                username: ${{ vars.DOCKERHUB_USERNAME }}
                password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Build and Push
              uses: docker/build-push-action@v7
              with: 
                context: ./frontend
                push: true
                tags: ${{ vars.DOCKERHUB_USERNAME }}/devboard-frontend:latest

    backend:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout the code
              uses: actions/checkout@v4

            - name: Set up Go
              uses: actions/setup-go@v7
              with:
                go-version: "1.23"
                go-version-file: 'go.mod'
                check-latest: false
                cache-dependency-path: 'go.sum'

            - name: Run Go Formatter
              run: go fmt
              working-directory: backend

            - name: RUN Go vet
              run: go vet
              working-directory: backend

            - name: Run Tests
              run: go test
              working-directory: backend

            - name: Docker Login
              uses: docker/login-action@v4
              with:
                username: ${{ vars.DOCKERHUB_USERNAME }}
                password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Build and Push
              uses: docker/build-push-action@v7
              with: 
                context: ./backend
                push: true
                tags: ${{ vars.DOCKERHUB_USERNAME }}/devboard-backend:latest
                
              

            