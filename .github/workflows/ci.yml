# Goal: Build the image for devboard frontend and push to docker hub, after linting the code
name: CI

on: 
  push: 
    branches: [main]

jobs:
  code-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24' # Or your project's LTS version
          cache: 'npm'       # Caches dependencies for faster runs

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

  Build-and-push:
    needs: [code-lint]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Docker Login
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@v7
        with:
          push: true
          tags: ${{ vars.DOCKERHUB_USERNAME }}/devboard-fe-master:latest
      
