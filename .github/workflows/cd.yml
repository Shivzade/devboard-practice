# Goal: To deploy the built images from CI steps once the CI Workflow is Successed

name: CD

on:
    #workflow_run:
     #   workflows: ['CI']
        #types: [completed]
        #branches: 
         #   - 'advanced'
    workflow_dispatch:

jobs:
    deploy:
        if: github.event.workflow_run.conclusion == 'success'
        runs-on: self-hosted
        steps:
         - name: Code Checkout
           uses: actions/checkout@v7


         - name: Cpoy Example ENV to main env
           run: cp .env.example .env

         - name: Docker Setup [Login]
           uses: docker/login-action@v4
           with:
            username: ${{ vars.DOCKERHUB_USERNAME }}
            password: ${{ secrets.DOCKERHUB_TOKEN }}

         - name: Deploy the Containers with Docker Compose
           run: |
            docker compose pull
            docker compose up -d

