# Goal - I have to ensure the packages and dependencies have been audited

name: Dependency Scan

on:
    workflow_call:

jobs:
    dependency-scan:
        runs-on: ubuntu-latest
        steps:
            - name: Code Checkout
              uses: actions/checkout@v7

            - name: Setup Go
              uses: actions/setup-go@v6
              with:
                go-version: 1.22
                check-latest: false
                cache-dependency-path: 'go.sum'

            - name: Install GoVulnCheck
              run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4

            - name: GoVulnCheck
              continue-on-error: true
              run: govulncheck ./... > govuncheck-report.txt
              working-directory: backend


            - name: Setup Node Js
              uses: actions/setup-node@v6
              with:
                node-version: "24"
                cache: npm
                dependency-path: frontend\package-lock.json

            - name: Run NPM Audit
              run: npm audit
              working-directory: frontend

            - name: Upload report to artifacts
              if: always() # Ensures the report uploads even if tests fail
              uses: actions/upload-artifact@v7
              with:
               name: dependency-scan-report
               path: reports/dependency-report.txt
               retention-days: 5 

            

            